<h1 class="main-title">Список рецептов</h1>

<div class="button-container">
  <p-button label="Reload recipes" (onClick)="loadRecipes()" />
</div>

<div class="p-table">
  <p-table class="container" [value]="(loading$ | async) ? mockData : ((recipes$ | async) ?? [])">
    <ng-template #header>
      <tr>
        <th>Название</th>
        <th>Кухня</th>
        <th>Время приготовления</th>
        <th>Рейтинг</th>
      </tr>
    </ng-template>
    <ng-template #body let-recipe>
      <tr>
        @if (loading$ | async) {
          <td><p-skeleton /></td>
          <td><p-skeleton /></td>
          <td><p-skeleton /></td>
          <td><p-skeleton /></td>
        } @else {
          <td>{{ recipe.name }}</td>
          <td>{{ recipe.cuisine }}</td>
          <td>{{ recipe.cookTimeMinutes }} мин.</td>
          <td>{{ recipe.rating }}</td>
        }
      </tr>
    </ng-template>
    <ng-template #emptymessage>
      <tr>
        <td colspan="4">
          @if ((error$ | async) === null) {
            Рецепты не найдены.
          }
        </td>
      </tr>
    </ng-template>
  </p-table>
</div>
